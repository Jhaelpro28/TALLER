<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pacientes</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Inicio</a> |
        <a th:href="@{/citas}">Citas</a> |
        <a th:href="@{/pacientes}">Pacientes</a> |
        <a th:href="@{/doctores}">Doctores</a>
    </nav>
    <h1>Pacientes</h1>
    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${paciente}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.documento}"></td>
                <td th:text="${p.telefono}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
